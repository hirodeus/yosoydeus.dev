<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3U5 - GPU Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      user-select: none; /* Evita selección de texto accidental */
    }
    
    /* Animaciones Custom */
    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 5px #39FF14, 0 0 10px #39FF14; }
      50% { text-shadow: 0 0 15px #39FF14, 0 0 30px #39FF14; }
    }
    @keyframes fade-in-late {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    .animate-fade-in-late {
      animation: fade-in-late 1s ease-out 1s forwards;
    }

    /* Scrollbar Estilo Cyberpunk */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #06b6d4; /* Cyan */
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: #22d3ee;
    }

    /* Range Input Custom Style */
    input[type=range] {
        height: 4px;
    }
    input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        background: #06b6d4;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        box-shadow: 0 0 0 0 rgba(6, 182, 212, 0);
    }
    input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.25);
        box-shadow: 0 0 8px rgba(6, 182, 212, 0.6);
    }

    /* Select dropdown dark style */
    select option {
        background: #111827;
        color: #e2e8f0;
    }

    /* MIDI learn pulse */
    @keyframes midi-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .midi-learning {
      animation: midi-pulse 0.8s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "three": "https://esm.sh/three@0.160.0",
      "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  
  <script type="module" src="./main.js"></script>
</body>
</html>
